version: '3.8'

# ===========================================
# 开发环境 override
# 启动：docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# 特点：
#   - ENV=development，DEBUG=true
#   - SECRET_KEY 留空会自动生成
#   - MongoDB 端口对外暴露（便于本地调试）
#   - 向量库默认 chroma（无需额外容器）
# ===========================================

services:
  backend:
    environment:
      - ENV=development
      - DEBUG=true
      - SECRET_KEY=${SECRET_KEY:-}
      - VECTOR_STORE_BACKEND=${VECTOR_STORE_BACKEND:-chroma}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}

  mongodb:
    ports:
      - "27017:27017"
