# =====================================================
# VM 自动部署 workflow
#
# 触发：
#   - 手动（workflow_dispatch）：前端/后端镜像已推送后可使用
#   - push 到 master/main 时自动触发：CI 构建推送镜像 → 本 workflow 在 VM 拉镜像重启
#
# 运行环境：VM 上常驻的 self-hosted runner（label: agent-vm）
#   注意：VM 访问 github/ghcr 慢，backend 含 3.5GB torch 层，从 ghcr 拉取不可行，
#   故 backend 在 VM 本地构建（SSH deploy key pull 源码 → docker build）。
#   frontend 走 ghcr（62MB）。
#   VM 部署目录 /home/jesom/rag-src 是 git 仓库（origin = git@github.com）。
#   compose 文件已随库入库，CI 负责 git pull → 拉 frontend 镜像 → 重建 backend
# ===========================================
name: Deploy to VM

on:
  workflow_dispatch:
  push:
    branches: [master, main]

jobs:
  deploy:
    name: Pull & redeploy on VM
    runs-on: [self-hosted, agent-vm]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Update source code
        run: |
          cd /home/jesom/rag-src
          git fetch origin master
          git reset --hard origin/master

      - name: Pull frontend image
        run: |
          cd /home/jesom/rag-src
          docker compose -f docker-compose.linux.yml -f docker-compose.linux.prod.yml pull frontend

      - name: Rebuild & redeploy
        run: |
          cd /home/jesom/rag-src
          docker compose -f docker-compose.linux.yml -f docker-compose.linux.prod.yml build backend
          docker compose -f docker-compose.linux.yml -f docker-compose.linux.prod.yml up -d backend frontend

      - name: Logout GHCR
        if: ${{ always() }}
        run: docker logout ghcr.io