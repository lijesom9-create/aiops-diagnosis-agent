name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:
  # ──────────────────────────────────────────────
  # Frontend: install → lint (optional) → build
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Lint
        run: |
          cd frontend
          npx eslint --ext ts,tsx src/ --max-warnings 50
        continue-on-error: true

      - name: Build (tsc + vite)
        run: |
          cd frontend
          npm run build

  # ──────────────────────────────────────────────
  # Admin Frontend: install → build
  # ──────────────────────────────────────────────
  admin-frontend:
    name: Admin Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd admin-frontend
          npm install --legacy-peer-deps

      - name: Build (tsc + vite)
        run: |
          cd admin-frontend
          npm run build

  # ──────────────────────────────────────────────
  # Backend: install core deps, verify critical
  # tests. Not blocking if tests fail — heavy ML
  # deps (chromadb, sentence-transformers) aren't
  # installed here to avoid dependency conflicts.
  # ──────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc curl

      - name: Install core Python deps (no ML stack)
        run: |
          cd backend
          pip install --no-cache-dir \
            "fastapi==0.104.1" "uvicorn[standard]==0.24.0" "python-multipart==0.0.6" \
            "pymongo==4.6.1" "motor==3.3.2" \
            "PyJWT==2.11.0" "passlib[bcrypt]==1.7.4" "bcrypt==4.0.1" \
            "pydantic==2.5.2" "pydantic-settings==2.1.0" "python-dotenv==1.0.0" \
            "httpx>=0.25.2" "loguru==0.7.2" \
            "websockets==12.0" \
            "pytest==7.4.3" "pytest-asyncio==0.23.2"

      - name: Run unit tests
        run: |
          cd backend
          pytest tests/test_api_e2e.py::TestHealthAndConfig \
                  tests/test_api_e2e.py::TestAuthAPI \
                  tests/test_api_e2e.py::TestSecurity \
                  tests/test_e2e_fixes.py::TestAuthFlow \
                  tests/test_e2e_fixes.py::TestDatabaseFixes \
                  tests/test_document_upload.py::TestDocumentParser \
                  tests/test_document_upload.py::TestDocumentChunker \
                  tests/test_admin_api.py \
                  tests/test_feishu.py \
                  -v --tb=short --no-header
        timeout-minutes: 5
        env:
          MONGODB_URL: mongodb://localhost:27017
          INTENT_USE_LLM: "false"
          USE_REACT: "false"
          USE_LOCAL_EMBEDDING: "false"

  # ──────────────────────────────────────────────
  # Docker: build images (main/master only)
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [frontend, admin-frontend]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: education-agent-backend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: education-agent-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build admin-frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./admin-frontend
          push: false
          tags: education-agent-admin-frontend:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
