name: CI/CD Pipeline

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master"]

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "18"

jobs:
  # ──────────────────────────────────────────────
  # Lint: ruff（阻塞门禁——测试之外的静态质量线）
  # ──────────────────────────────────────────────
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: Run ruff
        run: |
          cd backend
          ruff check .

  # ──────────────────────────────────────────────
  # Frontend: install → lint (optional) → build
  # ──────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Lint
        run: |
          cd frontend
          npx eslint --ext ts,tsx src/ --max-warnings 50
        continue-on-error: true

      - name: Build (tsc + vite)
        run: |
          cd frontend
          npm run build

  # ──────────────────────────────────────────────
  # Admin Frontend: install → build
  # ──────────────────────────────────────────────
  admin-frontend:
    name: Admin Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd admin-frontend
          npm install --legacy-peer-deps

      - name: Build (tsc + vite)
        run: |
          cd admin-frontend
          npm run build

  # ──────────────────────────────────────────────
  # Backend Lint: ruff（阻塞门禁——代码质量进入发布依赖链）
  # ──────────────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff==0.15.12

      - name: Run ruff check
        run: |
          cd backend
          ruff check .

  # ──────────────────────────────────────────────
  # Backend Type Check: mypy 棘轮门禁（P1-C 升级为阻塞）
  # 仅检查 app/core + app/api；按「文件级错误计数」与 mypy-baseline.json 比较，
  # 存量错误冻结不增、新增代码零错误——有意放宽需 python scripts/mypy_ratchet.py --update
  # 并在提交说明注明。基线在 CI 镜像依赖环境生成（本地全量 venv 计数会漂移）。
  # ──────────────────────────────────────────────
  backend-mypy:
    name: Backend Type Check (mypy ratchet)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install mypy + core deps
        run: |
          pip install mypy
          cd backend
          pip install --no-cache-dir \
            "fastapi==0.141.1" "pydantic==2.13.5" "pydantic-settings==2.14.2" \
            "loguru==0.7.3" "PyJWT==2.13.0" "passlib[bcrypt]==1.7.4" \
            "httpx==0.28.1" "motor==3.7.1"

      - name: Run mypy ratchet (blocking on new errors)
        run: |
          cd backend
          python scripts/mypy_ratchet.py

  # ──────────────────────────────────────────────
  # Backend: install core deps, run critical tests.
  # Tests are blocking — failure fails the pipeline
  # and blocks image publish (docker job needs this
  # job). Heavy ML deps aren't installed here; the
  # selected suites cover auth/permission/documents
  # without them.
  # ──────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc curl

      - name: Install core Python deps (no ML stack)
        run: |
          cd backend
          pip install --no-cache-dir \
            "fastapi==0.141.1" "uvicorn[standard]==0.34.0" "python-multipart==0.0.31" \
            "pymongo==4.17.0" "motor==3.7.1" \
            "PyJWT==2.13.0" "passlib[bcrypt]==1.7.4" "bcrypt==4.0.1" \
            "pydantic==2.13.5" "pydantic-settings==2.14.2" "python-dotenv==1.2.2" \
            "httpx==0.28.1" "requests>=2.31.0" "loguru==0.7.3" \
            "langchain-core==1.6.2" "langchain-openai==1.1.14" "langgraph==1.2.11" \
            "qdrant-client==1.19.0" \
            "email-validator==2.3.0" \
            -r requirements-dev.txt

      - name: Run unit tests (with coverage)
        run: |
          cd backend
          pytest tests/test_api_e2e.py::TestHealthAndConfig \
                  tests/test_api_e2e.py::TestAuthAPI \
                  tests/test_api_e2e.py::TestSecurity \
                  tests/test_e2e_fixes.py::TestAuthFlow \
                  tests/test_e2e_fixes.py::TestDatabaseFixes \
                  tests/test_document_upload.py::TestDocumentParser \
                  tests/test_document_upload.py::TestDocumentChunker \
                  tests/test_admin_api.py \
                  tests/test_admin_permission.py \
                  tests/test_security_hardening.py \
                  tests/test_ai_failover.py \
                  -v --tb=short --no-header --cov=app --cov-report=term
        timeout-minutes: 10
        env:
          MONGODB_URL: mongodb://localhost:27017
          VECTOR_STORE_BACKEND: qdrant   # 对齐生产后端（默认 chroma 是无 Docker 本地兜底）
          QDRANT_HOST: localhost
          QDRANT_PORT: "6333"
          INTENT_USE_LLM: "false"
          USE_REACT: "false"
          USE_LOCAL_EMBEDDING: "false"

  # ──────────────────────────────────────────────
  # Security: pip-audit 依赖漏洞审计（核心子集，起步仅报告）
  # 审计范围见 backend/requirements-audit.txt（不含 torch 等本地版本 wheel）；
  # 已知豁免：chromadb 1.5.9 上游无修复版（4 项），待新版本发布后升级收口
  # ──────────────────────────────────────────────
  security:
    name: Dependency Audit (pip-audit)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit==2.10.1

      - name: Audit core dependency subset
        # chromadb 1.5.9 的 4 项为已知豁免（上游无修复版，见整改记录 §11-B）；
        # 其余任何漏洞出现都会让本步非零退出（continue-on-error 只吞已知项）
        run: |
          cd backend
          pip-audit -r requirements-audit.txt --no-deps \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833

  # ──────────────────────────────────────────────
  # Docker: build & push images (main/master only)
  # 镜像推送到 ghcr.io，供 VM 自部署 / 回滚使用
  # ──────────────────────────────────────────────
  docker:
    name: Docker Build & Push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [frontend, admin-frontend, backend, backend-lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.ci
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiops-backend:latest
            ghcr.io/${{ github.repository_owner }}/aiops-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiops-frontend:latest
            ghcr.io/${{ github.repository_owner }}/aiops-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push admin-frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./admin-frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiops-admin-frontend:latest
            ghcr.io/${{ github.repository_owner }}/aiops-admin-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
