# 工程卫生配置：ruff lint（CI 阻塞门禁，见 .github/workflows/ci.yml 的 lint job）
# 运行方式：python -m ruff check .        （CI）
#           python -m ruff check . --fix （本地自动修复）

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["venv", "data", "uploads", "__pycache__"]

[tool.ruff.lint]
# E4/E7/E9: pycodestyle 错误子集（缩进/语句/运行时错误）
# F: pyflakes（未用导入/未定义名）
# I: import 排序
# B: bugbear 常见陷阱（可变默认参数等）
# ASYNC: async 常见错误
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
ignore = [
    "E501",  # 行长不强制（prompt 长字符串多），由格式化工具阶段治理
    "B008",  # FastAPI 依赖注入惯用法（Depends(...) 作默认参数）
    "E402",  # 模块级延迟导入是有意模式（重依赖懒加载，避免导入即加载模型）
    "B904",  # raise ... from 已知债务（44 处，跟踪于错误处理专项）
    "B905",  # zip() strict 参数为 3.10+ 风格迁移项
    "ASYNC230", "ASYNC210", "ASYNC240",  # async 内同步 IO：既有模式（httpx 同步调用等），改造 tracked
]

[tool.ruff.lint.per-file-ignores]
# 评测/脚本类允许宽松风格（一次性调优脚本，不进 CI 关键路径）
"evaluation/**" = ["T201", "E701", "E702", "E722", "F841", "B007"]
"scripts/**" = ["E402", "E722", "F841", "B007"]
"mcp_servers/**" = ["E402"]
"tests/**" = ["E402"]

[tool.ruff.format]
quote-style = "preserve"

# ========== C5: mypy 渐进接入 ==========
# 策略：仅对 app/core/ + app/api/ 新代码目录启用检查，存量 44k 行不做全量。
# CI 起步阶段 continue-on-error（非阻塞），随新代码类型覆盖度提升再逐步收紧。
# exclude：第三方/评测/测试/脚本/MCP server/数据目录不检查
#
# 运行方式：
#   python -m mypy app/core app/api          （本地，CI 同）
#   python -m mypy app/core app/api --strict （未来收紧方向）
[tool.mypy]
python_version = "3.12"
exclude = [
    "evaluation/",
    "tests/",
    "scripts/",
    "mcp_servers/",
    "data/",
    "uploads/",
    "venv/",
]
# 第三方库无类型 stub 时不报 missing-imports（避免噪声）
ignore_missing_imports = true
# 存量代码未标注类型不报错（渐进接入，只查新增类型错误）
check_untyped_defs = false
# 不强制要求所有函数有类型注解（起步阶段宽松）
disallow_untyped_defs = false
# 不强制要求完整类型（起步阶段宽松）
disallow_incomplete_defs = false
# 允许 Any（FastAPI/langgraph 等动态类型多，起步不强约束）
disallow_any_explicit = false
warn_unused_ignores = true
warn_redundant_casts = true
# 基础告警：未用 ignore、冗余 cast、返回值不匹配
warn_return_any = false
no_implicit_optional = true

# ========== 测试覆盖率度量 ==========
# 运行方式：
#   python -m pytest tests -q --cov=app --cov-report=term   （全量 + 覆盖率）
# 口径：只度量生产代码 app/；evaluation（脚本性质）与测试自身不计入
[tool.coverage.run]
source = ["app"]
omit = [
    "app/evaluation/*",
    "*/tests/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
show_missing = false
skip_covered = false
